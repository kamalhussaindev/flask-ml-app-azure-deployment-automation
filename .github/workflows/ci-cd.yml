name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Build Docker images
        run: docker-compose build

      - name: Security Scan
        uses: anchore/scan-action@v2
        with:
          image: breast-cancer-app:latest

      - name: Push to Docker Hub
        uses: docker/build-push-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: your-docker-hub-username/breast-cancer-app
          tag_with_ref: true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: 'kamalhussain611/breast-cancer-app:latest'
          client-id: ${{ secrets.AZURE_SP_APP_ID }}
          client-secret: ${{ secrets.AZURE_SP_PASSWORD }}
          tenant-id: ${{ secrets.AZURE_SP_TENANT }}

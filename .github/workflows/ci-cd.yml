name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Flask image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/breast-cancer-app:${{ github.sha }} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/breast-cancer-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/breast-cancer-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/breast-cancer-app:latest

      - name: Build and Push MySQL image
        run: |
          docker build -f Dockerfile.mysql -t ${{ secrets.DOCKER_USERNAME }}/breast-cancer-mysql:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/breast-cancer-mysql:latest

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Site Containers
        run: |
          # Ensure SITECONTAINERS mode
          az webapp config set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group flask-ml-app-azure-deployment-automation \
            --linux-fx-version "SITECONTAINERS"

          # Update main container image
          az webapp sitecontainers update \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group flask-ml-app-azure-deployment-automation \
            --container-name main \
            --image ${{ secrets.DOCKER_USERNAME }}/breast-cancer-app:${{ github.sha }}

          # Restart
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group flask-ml-app-azure-deployment-automation
